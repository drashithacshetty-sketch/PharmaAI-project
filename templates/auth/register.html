{% extends "base.html" %}

{% block title %}Register New Account | PharmaAI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card-modern p-4 p-sm-5">
        <div class="text-center mb-4">
          <div class="brand-icon-wrapper mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
            <i class="bi bi-person-plus-fill"></i>
          </div>
          <h3 class="fw-bold text-navy">Create Pharmacy Account</h3>
          <p class="text-muted small">Register to manage stock, sales, and demand forecasting</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="mb-3">
            <label for="full_name" class="form-label fw-semibold">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person-vcard"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" id="full_name" name="full_name" placeholder="e.g. Dr. Ramesh Kumar" required autofocus>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label for="username" class="form-label fw-semibold">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-at"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="rameshk" required>
              </div>
            </div>
            <div class="col-sm-6">
              <label for="role" class="form-label fw-semibold">Role</label>
              <select class="form-select" id="role" name="role" required>
                <option value="Pharmacist" selected>Pharmacist</option>
                <option value="Admin">Pharmacy Admin</option>
                <option value="Staff">Inventory Staff / Cashier</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="ramesh@pharmacy.com" required>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-sm-6">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Min. 6 chars" minlength="6" required>
              </div>
            </div>
            <div class="col-sm-6">
              <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="confirm_password" name="confirm_password" placeholder="Repeat password" minlength="6" required>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-emerald w-100 py-2 fs-6">
            <i class="bi bi-check-circle-fill me-1"></i> Register Account
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="small text-muted mb-0">
            Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-bold">Sign In</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
