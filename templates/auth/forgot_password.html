{% extends "base.html" %}

{% block title %}Reset Password | PharmaAI{% endblock %}

{% block content %}
<div class="py-5 d-flex align-items-center" style="min-height: calc(100vh - 180px); background: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.12) 0%, transparent 45%), radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 45%), linear-gradient(180deg, #090e17 0%, #0f172a 100%);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5 col-xl-4">

        <div class="p-4 p-sm-5 shadow-lg position-relative" style="background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px;">
          
          <div class="text-center mb-4">
            <div class="brand-icon-wrapper mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem; border-radius: 16px; background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #ffffff; display: flex; align-items: center; justify-content: center;">
              <i class="bi bi-key-fill"></i>
            </div>
            <h3 class="fw-bold text-white mb-1">Reset Password</h3>
            <p class="text-white-50 small mb-0">Enter your username or email to recover access</p>
          </div>

          <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div class="mb-3">
              <label for="identity" class="form-label text-white small fw-semibold">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text border-end-0" style="background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.18); color: #94a3b8;">
                  <i class="bi bi-envelope-fill"></i>
                </span>
                <input type="text" class="form-control border-start-0 text-white" id="identity" name="identity" placeholder="e.g. pharmacist or admin@pharma.com" required autofocus style="background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.18);">
              </div>
            </div>

            <button type="submit" class="btn btn-emerald w-100 py-3 fs-6 d-flex align-items-center justify-content-center gap-2 shadow" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: none; border-radius: 12px; font-weight: 600; color: #ffffff;">
              <span>Send Reset Instructions</span>
              <i class="bi bi-arrow-right"></i>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top border-white border-opacity-10">
            <p class="small text-white-50 mb-0">
              <a href="{{ url_for('auth.login') }}" class="text-emerald text-decoration-none fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Back to Sign In
              </a>
            </p>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
