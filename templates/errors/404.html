{% extends "base.html" %}

{% block title %}Page Not Found (404) | PharmaAI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card-modern p-5 my-4">
        <div class="display-1 fw-bold text-navy mb-2">404</div>
        <div class="brand-icon-wrapper mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem; background: var(--alert-bg); color: var(--alert-red);">
          <i class="bi bi-question-circle"></i>
        </div>
        <h4 class="fw-bold text-navy mb-2">Medicine or Page Not Found</h4>
        <p class="text-muted small mb-4">
          The requested pharmaceutical record, page URL, or report could not be found or has been relocated.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('main.dashboard') }}" class="btn btn-emerald">
            <i class="bi bi-house me-1"></i> Return to Dashboard
          </a>
          <a href="{{ url_for('medicines.index') }}" class="btn btn-outline-secondary">
            <i class="bi bi-search me-1"></i> Browse Catalog
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
